<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран записи -->
    <div id="record-screen" class="screen active">
        <div id="waveform-container">
            <canvas id="liveWaveform"></canvas>
        </div>

        <div class="status-text" id="statusText">Готов к записи</div>

        <div class="controls">
            <!-- Кнопка Отмены (появляется при записи) -->
            <button class="btn-icon hidden" id="cancelBtn" title="Отменить">✖</button>
            
            <!-- Главная кнопка (Запись / Пауза / Продолжить) -->
            <button class="btn-main" id="mainBtn"></button>
            
            <!-- Кнопка Сохранить (появляется при записи) -->
            <button class="btn-icon hidden" id="finishBtn" title="Завершить">✔</button>
        </div>
    </div>

    <!-- Экран Редактора (пока заготовка для следующего шага) -->
    <div id="editor-screen" class="screen">
        <h2>Редактор</h2>
        <div class="status-text" id="filePathText"></div>
        
        <!-- Тут потом будет wavesurfer.js -->
        <div class="editor-placeholder">Тут будет красивая статика с ползунками</div>

        <div class="export-controls">
            <select id="exportFormat" class="format-select">
                <option value="mp3">.MP3</option>
                <option value="wav">.WAV</option>
            </select>
            <button class="btn-export" id="exportBtn">ОБРЕЗАТЬ И СОХРАНИТЬ</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
