<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Recording Screen -->
    <div id="record-screen" class="screen active">
        <div id="waveform-container">
            <canvas id="liveWaveform"></canvas>
        </div>

        <div class="status-text" id="statusText">Ready to record</div>

        <div class="controls">
            <button class="btn-icon hidden" id="cancelBtn" title="Cancel">✖</button>
            <button class="btn-main" id="mainBtn"></button>
            <button class="btn-icon hidden" id="finishBtn" title="Finish">✔</button>
        </div>
    </div>

    <!-- Editor Screen -->
    <!-- Editor Screen -->
    <div id="editor-screen" class="screen">
        <h2>Editor</h2>
        <div class="status-text" id="filePathText"></div>
        
        <!-- Контейнер для волны обрезки -->
        <div id="editor-waveform" style="width: 90%; margin-bottom: 15px;"></div>

        <!-- Панель инструментов редактора -->
        <div class="editor-toolbar" style="display: flex; gap: 10px; margin-bottom: 30px; align-items: center;">
            <button class="btn-tool" id="cutLeftBtn" title="Cut All Left">[C] Cut Left</button>
            <button class="btn-tool play-btn" id="playPauseBtn" title="Play/Pause (Space)">▶</button>
            <button class="btn-tool" id="cutRightBtn" title="Cut All Right">[V] Cut Right</button>
        </div>

        <div class="export-controls">
            <select id="exportFormat" class="format-select">
                <option value="mp3">.MP3</option>
                <option value="wav">.WAV</option>
            </select>
            <button class="btn-export" id="exportBtn">TRIM & SAVE</button>
            <button class="btn-export" id="backBtn" style="background: #ff4757; color: white;">DISCARD</button>
        </div>
    </div>

    <!-- Подключаем Wavesurfer.js и плагин для выделения (Regions) -->
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
